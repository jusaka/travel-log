<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1a">
<title>旅途纵横 · TravelLog</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Loading Screen -->
<div id="loading" class="loading-screen">
  <div class="loading-globe">
    <div class="globe-ring"></div>
    <div class="globe-plane">✈</div>
  </div>
  <div class="loading-text">旅途纵横</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<!-- Main App -->
<div id="app" style="display:none">
  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <span class="app-logo">✈️</span>
      <span class="app-title">旅途纵横</span>
    </div>
    <div class="header-right">
      <button id="btnAddTrip" class="btn-icon" title="添加行程">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button id="btnSettings" class="btn-icon" title="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Tab Navigation -->
  <nav id="tabNav">
    <button class="tab active" data-tab="map">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>足迹</span>
    </button>
    <button class="tab" data-tab="trips">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>行程</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>统计</span>
    </button>
    <button class="tab" data-tab="annual">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/><circle cx="12" cy="6" r="2"/></svg>
      <span>年报</span>
    </button>
  </nav>

  <!-- Map View -->
  <div id="viewMap" class="view active">
    <canvas id="mapCanvas"></canvas>
    <div id="mapControls">
      <button id="btnZoomIn" class="map-btn">+</button>
      <button id="btnZoomOut" class="map-btn">−</button>
      <button id="btnResetView" class="map-btn">🏠</button>
    </div>
    <div id="mapLegend">
      <div class="legend-item"><span class="legend-dot flight"></span>飞行</div>
      <div class="legend-item"><span class="legend-dot train"></span>高铁</div>
    </div>
    <div id="mapTooltip" class="map-tooltip" style="display:none"></div>
    <div id="mapSummary">
      <span id="mapFlightCount">0 次飞行</span>
      <span class="sep">·</span>
      <span id="mapTrainCount">0 次高铁</span>
      <span class="sep">·</span>
      <span id="mapCityCount">0 个城市</span>
    </div>
  </div>

  <!-- Trips View -->
  <div id="viewTrips" class="view">
    <div class="view-header">
      <div class="search-bar">
        <input type="text" id="tripSearch" placeholder="🔍 搜索城市、航班号..." autocomplete="off">
      </div>
      <div class="filter-row">
        <select id="filterType">
          <option value="all">全部</option>
          <option value="flight">✈️ 飞行</option>
          <option value="train">🚄 高铁</option>
        </select>
        <select id="filterYear">
          <option value="all">全部年份</option>
        </select>
        <select id="filterSort">
          <option value="newest">最近优先</option>
          <option value="oldest">最早优先</option>
        </select>
      </div>
    </div>
    <div id="tripList" class="trip-list"></div>
    <div id="emptyTrips" class="empty-state" style="display:none">
      <div class="empty-icon">✈️</div>
      <div class="empty-text">开启你的旅程</div>
      <div class="empty-sub">记录每一次飞行和铁路旅行<br>构建你的专属足迹地图</div>
      <button class="btn btn-primary" style="margin-top:20px" onclick="Trips.openAdd()">📝 添加第一条行程</button>
    </div>
  </div>

  <!-- Stats View -->
  <div id="viewStats" class="view">
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <!-- Annual Report View -->
  <div id="viewAnnual" class="view">
    <div class="annual-header">
      <button id="annualPrev" class="annual-nav">◀</button>
      <span id="annualYear" class="annual-year">2026</span>
      <button id="annualNext" class="annual-nav">▶</button>
    </div>
    <div id="annualContent" class="annual-content"></div>
  </div>
</div>

<!-- Add Trip Modal -->
<div id="addTripModal" class="modal" style="display:none">
  <div class="modal-content modal-large">
    <div class="modal-header">
      <h3 id="modalTitle">添加行程</h3>
      <button class="modal-close" onclick="closeModal('addTripModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="type-toggle">
        <button class="type-btn active" data-type="flight">✈️ 飞行</button>
        <button class="type-btn" data-type="train">🚄 高铁</button>
      </div>

      <!-- Flight Form -->
      <div id="flightForm" class="trip-form">
        <div class="form-row">
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="fDate" required>
          </div>
          <div class="form-group">
            <label>航班号</label>
            <input type="text" id="fFlightNo" placeholder="如 CA1234" autocomplete="off">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>出发机场</label>
            <input type="text" id="fFrom" placeholder="搜索机场..." autocomplete="off">
            <div class="search-results" id="fFromResults"></div>
          </div>
          <div class="form-group arrow-sep">→</div>
          <div class="form-group">
            <label>到达机场</label>
            <input type="text" id="fTo" placeholder="搜索机场..." autocomplete="off">
            <div class="search-results" id="fToResults"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>出发时间</label>
            <input type="time" id="fDepTime">
          </div>
          <div class="form-group">
            <label>到达时间</label>
            <input type="time" id="fArrTime">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>航司</label>
            <select id="fAirline">
              <option value="">自动识别</option>
            </select>
          </div>
          <div class="form-group">
            <label>机型</label>
            <input type="text" id="fAircraft" placeholder="如 B737-800">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>座位</label>
            <input type="text" id="fSeat" placeholder="如 12A">
          </div>
          <div class="form-group">
            <label>舱位</label>
            <select id="fClass">
              <option value="economy">经济舱</option>
              <option value="premium">超级经济舱</option>
              <option value="business">商务舱</option>
              <option value="first">头等舱</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>备注</label>
          <textarea id="fNote" placeholder="旅途记忆..." rows="2"></textarea>
        </div>
      </div>

      <!-- Train Form -->
      <div id="trainForm" class="trip-form" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="tDate" required>
          </div>
          <div class="form-group">
            <label>车次</label>
            <input type="text" id="tTrainNo" placeholder="如 G1234" autocomplete="off">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>出发站</label>
            <input type="text" id="tFrom" placeholder="搜索车站..." autocomplete="off">
            <div class="search-results" id="tFromResults"></div>
          </div>
          <div class="form-group arrow-sep">→</div>
          <div class="form-group">
            <label>到达站</label>
            <input type="text" id="tTo" placeholder="搜索车站..." autocomplete="off">
            <div class="search-results" id="tToResults"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>出发时间</label>
            <input type="time" id="tDepTime">
          </div>
          <div class="form-group">
            <label>到达时间</label>
            <input type="time" id="tArrTime">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>座位</label>
            <input type="text" id="tSeat" placeholder="如 5车12A">
          </div>
          <div class="form-group">
            <label>席别</label>
            <select id="tSeatType">
              <option value="second">二等座</option>
              <option value="first">一等座</option>
              <option value="business">商务座</option>
              <option value="sleeper">卧铺</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>备注</label>
          <textarea id="tNote" placeholder="旅途记忆..." rows="2"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button id="btnDeleteTrip" class="btn btn-danger" style="display:none">删除</button>
      <button id="btnDuplicateTrip" class="btn btn-secondary" style="display:none">复制</button>
      <div class="flex-spacer"></div>
      <button class="btn btn-secondary" onclick="closeModal('addTripModal')">取消</button>
      <button id="btnSaveTrip" class="btn btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <h3>设置</h3>
      <button class="modal-close" onclick="closeModal('settingsModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="settings-section">
        <h4>外观</h4>
        <div style="display:flex;gap:8px">
          <button class="btn btn-theme" id="btnThemeDark" style="flex:1">🌙 深色</button>
          <button class="btn btn-theme" id="btnThemeLight" style="flex:1">☀️ 浅色</button>
        </div>
      </div>
      <div class="settings-section">
        <h4>数据管理</h4>
        <button class="btn btn-full" id="btnCopyData">📋 复制到剪贴板</button>
        <button class="btn btn-full" id="btnPasteData">📥 从剪贴板导入</button>
        <div style="border-top:1px solid var(--border);margin:12px 0;padding-top:8px">
          <button class="btn btn-full" id="btnExport" style="font-size:13px;opacity:.7">📤 导出文件 (JSON)</button>
          <button class="btn btn-full" id="btnExportCSV" style="font-size:13px;opacity:.7">📊 导出文件 (CSV)</button>
          <button class="btn btn-full" id="btnImport" style="font-size:13px;opacity:.7">📥 导入文件 (JSON/CSV)</button>
        </div>
        <input type="file" id="importFile" accept=".json,.csv" style="display:none">
        <button class="btn btn-full" id="btnAddSample">🎁 添加示例数据</button>
        <button class="btn btn-full" id="btnClearAll" style="color:var(--danger)">🗑️ 清空所有数据</button>
      </div>
      <div class="settings-section">
        <h4>快捷键</h4>
        <p class="about-text" style="font-size:12px;line-height:1.8">
          <kbd style="background:var(--bg3);padding:2px 6px;border-radius:4px">N</kbd> 新建行程<br>
          <kbd style="background:var(--bg3);padding:2px 6px;border-radius:4px">1-4</kbd> 切换标签页<br>
          <kbd style="background:var(--bg3);padding:2px 6px;border-radius:4px">Esc</kbd> 关闭弹窗
        </p>
      </div>
      <div class="settings-section">
        <h4>关于</h4>
        <p class="about-text">旅途纵横 v4.7<br>记录每一次出发，珍藏每一段旅程<br><span style="color:var(--text3);font-size:11px;margin-top:4px;display:block">Made with ❤️ by 和珅</span></p>
      </div>
    </div>
  </div>
</div>

<!-- Trip Detail Modal -->
<div id="tripDetailModal" class="modal" style="display:none">
  <div class="modal-content modal-large">
    <div class="modal-header">
      <h3 id="detailTitle">行程详情</h3>
      <button class="modal-close" onclick="closeModal('tripDetailModal')">×</button>
    </div>
    <div class="modal-body" id="tripDetailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('tripDetailModal')">关闭</button>
      <div class="flex-spacer"></div>
      <button class="btn btn-primary" id="btnEditFromDetail">✏️ 编辑</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div id="confirmModal" class="modal" style="display:none">
  <div class="modal-content modal-small">
    <div class="modal-body" style="text-align:center;padding:24px">
      <p id="confirmMsg"></p>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-secondary" id="confirmCancel">取消</button>
      <button class="btn btn-danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="data/airports.js?v=1773634339"></script>
<script src="js/utils.js?v=1773634339"></script>
<script src="js/store.js?v=1773634339"></script>
<script src="js/map.js?v=1773634339"></script>
<script src="js/trips.js?v=1773634339"></script>
<script src="js/stats.js?v=1773634339"></script>
<script src="js/annual.js?v=1773634339"></script>
<script src="js/app.js?v=1773634339"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
